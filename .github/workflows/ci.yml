name: CI

# Checks on every pull request and on every push to main (ADR 0001). tools/ship_step.py waits for every check of the
# pull request and fast-forwards main only when all of them are green.
#   - "Tests": the documentation checks (tools/check_docs.py) and, once it exists (M1-1), the package check.
#   - "Lua tests": the offline addon tests (Tests/run_tests.py: Lua 5.1 through lupa on a mock client, adapted from
#     Azeroth Accord in M1-2). The job runs them on every pull request (the conditions below are only a safety net).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Links, wiki sidebar, links and languages, ADR index, roadmap format, privacy scan, LF line endings, the docs
      # rule's own cases.
      - name: Check the documentation
        run: python -I -X utf8 tools/check_docs.py

      # Lua syntax of the spike probe (tools/probe); skipped with a notice when lupa is missing.
      - name: Check the probe syntax
        run: |
          python -m pip install lupa==2.8
          python -I -X utf8 tools/check_probe.py

      # tools/site_export.py merges the addon's export into the community site's files; its tests need only Python.
      - name: Test the site-export script
        run: python -I -X utf8 -m unittest discover -s Tests -p "test_*.py"

      # What .pkgmeta would put in the release zip (from M1-1 on).
      - name: Check the package contents
        if: hashFiles('tools/check_package.py') != ''
        run: python -I -X utf8 tools/check_package.py

  lua-tests:
    name: Lua tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: No tests yet
        if: hashFiles('Tests/run_tests.py') == ''
        run: echo "::notice title=Lua tests skipped::Tests/run_tests.py does not exist yet (it arrives with step M1-2)."

      - name: Set up Python
        if: hashFiles('Tests/run_tests.py') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The libraries are pinned in .pkgmeta and never committed (from M1-1 on). They are cached on the pins, so a
      # run only downloads when a pin changes.
      - name: Cache the libraries
        if: hashFiles('Tests/run_tests.py') != '' && hashFiles('tools/fetch_libs.py') != ''
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: FinlandDragonCreditPoints/Libs
          key: libs-${{ hashFiles('.pkgmeta', 'tools/fetch_libs.py') }}

      - name: Fetch the libraries
        if: hashFiles('Tests/run_tests.py') != '' && hashFiles('tools/fetch_libs.py') != ''
        run: python -I -X utf8 tools/fetch_libs.py

      - name: Run the addon tests
        if: hashFiles('Tests/run_tests.py') != ''
        run: |
          python -m pip install lupa==2.8
          python -I -X utf8 Tests/run_tests.py
